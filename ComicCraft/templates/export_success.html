<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comic Exported — ComicCraft</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="card success-card">
    <h1>✅ Comic Exported Successfully!</h1>
    <p>Your AI-powered comic has been created.</p>
    {% if pdf_path %}
      <a class="button" href="{{ pdf_path }}" download>Download PDF</a>
    {% endif %}
    <a class="secondary" href="/">Create Another Comic</a>
  </main>
</body>
</html>

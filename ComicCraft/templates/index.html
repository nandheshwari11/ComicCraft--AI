<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicCraft — Create Your Comic</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="hero">
  <main class="card form-card">
    <h1>🎨 ComicCraft</h1>
    <p class="subtitle">Turn your idea into an AI-powered comic.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/generate" method="post">
      <label>Story Prompt</label>
      <textarea name="story_prompt" required placeholder="A brave fox exploring an enchanted forest..."></textarea>

      <label>Main Character Name</label>
      <input name="character_name" required placeholder="Finn">

      <label>Setting</label>
      <select name="setting">
        <option>Forest</option>
        <option>School</option>
        <option>Space</option>
        <option>City</option>
        <option>Fantasy Kingdom</option>
      </select>

      <label>Story Tone</label>
      <select name="tone">
        <option>Funny</option>
        <option>Light-hearted</option>
        <option>Dramatic</option>
        <option>Poetic</option>
      </select>

      <label>Art Style</label>
      <select name="art_style">
        <option>Anime</option>
        <option>Comic Book</option>
        <option>Pixel Art</option>
        <option>Realistic</option>
      </select>

      <button type="submit">✨ Generate My Comic</button>
    </form>
  </main>
</body>
</html>
